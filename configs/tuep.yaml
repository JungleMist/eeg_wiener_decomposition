extends: default.yaml

# TUEP v3.1.0 patient-level epilepsy/control classification for Scripts 21-24.
# Match default.yaml's large-disk paths; keep result output separate.
paths:
  data_root: "/root/autodl-tmp/data/tuab/v3.0.1"
  cache_dir: "/root/autodl-tmp/cache"
  results_dir: "results_tuep"

dataset:
  active: "tuep"

# Script 23: independent raw/specific/coherent/specific_coherent EEGNet models
# on Script 22 caches. specific_coherent concatenates both 19-channel banks.
# Validation patient AUPRC selects the checkpoint;
# validation patient balanced accuracy selects the frozen threshold.
ml:
  tuep_component_eegnet:
    random_state: 42
    device: auto
    num_workers: 0
    F1: 8
    D: 2
    dropout: 0.25
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 64
    records_per_step: 4
    max_epochs: 200
    patience: 20
    lr_patience: 10
    lr_factor: 0.5
    early_stopping_metric: validation_patient_auprc
    threshold_selection: validation_patient_balanced_accuracy
